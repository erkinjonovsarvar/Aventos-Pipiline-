<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Analytics Dashboard</title>
    <!-- Chart.js kutubxonasi -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A;
            --card: #1E293B;
            --primary: #3B82F6;
            --success: #22C55E;
            --warning: #F59E0B;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { background-color: var(--bg); color: var(--text-main); padding: 20px; }

        /* Header va Filtrlar */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 24px; font-weight: 600; }
        
        .filter-bar {
            background: var(--card);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; }
        .filter-group select {
            background: var(--bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            min-width: 150px;
        }

        /* Asosiy ko'rsatkichlar (KPI) */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .kpi-card {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: transform 0.2s;
        }

        .kpi-card:hover { transform: translateY(-3px); border-color: var(--primary); }
        .kpi-title { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase;}
        .kpi-value { font-size: 28px; font-weight: 700; margin-bottom: 5px;}
        .kpi-trend { font-size: 13px; font-weight: 500; }
        .trend-up { color: var(--success); }
        .trend-down { color: var(--warning); }

        /* Grafiklar tarmog'i */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .chart-container {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            height: 350px;
            display: flex;
            flex-direction: column;
        }

        .chart-header { margin-bottom: 15px; font-size: 16px; font-weight: 600; }
        .canvas-wrapper { flex-grow: 1; position: relative; }

        @media (max-width: 900px) {
            .charts-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Korporativ Moliyaviy Dashboard</h1>
        <div style="color: var(--text-muted); font-size: 14px;" id="current-date"></div>
    </div>

    <!-- FILTRLAR -->
    <div class="filter-bar">
        <div class="filter-group">
            <label>Yil</label>
            <select id="filter-year">
                <option value="2026">2026</option>
                <option value="2025">2025</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Oy</label>
            <select id="filter-month">
                <option value="Barchasi">Barcha Oylar</option>
                <option value="Yanvar">Yanvar</option>
                <option value="Fevral">Fevral</option>
                <option value="Mart">Mart</option>
                <option value="Aprel">Aprel</option>
                <option value="May">May</option>
                <option value="Iyun" selected>Iyun</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Valyuta</label>
            <select id="filter-currency">
                <option value="UZS">UZS (So'm)</option>
                <option value="USD">USD ($)</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Filial</label>
            <select id="filter-branch">
                <option value="Barchasi">Barcha Filiallar</option>
                <option value="Toshkent">Toshkent HQ</option>
                <option value="Samarqand">Samarqand Hub</option>
                <option value="Farg'ona">Farg'ona Branch</option>
            </select>
        </div>
    </div>

    <!-- KPI KARTOCHKALAR -->
    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-title">Jami Tushum (Daromad)</div>
            <div class="kpi-value" id="kpi-revenue">0</div>
            <div class="kpi-trend trend-up" id="kpi-rev-trend">▲ +12.5% o'tgan oydan</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Sof Foyda</div>
            <div class="kpi-value" id="kpi-profit">0</div>
            <div class="kpi-trend trend-up" id="kpi-prof-trend">▲ +8.2% o'tgan oydan</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Operatsion Xarajatlar</div>
            <div class="kpi-value" id="kpi-expenses">0</div>
            <div class="kpi-trend trend-down" id="kpi-exp-trend">▼ -2.4% o'tgan oydan</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Mijozlar Soni</div>
            <div class="kpi-value" id="kpi-customers">0</div>
            <div class="kpi-trend trend-up">▲ +45 ta yangi</div>
        </div>
    </div>

    <!-- GRAFIKLAR -->
    <div class="charts-grid">
        <div class="chart-container">
            <div class="chart-header">Oylik Daromad va Xarajatlar Dinamikasi</div>
            <div class="canvas-wrapper">
                <canvas id="barChart"></canvas>
            </div>
        </div>
        <div class="chart-container">
            <div class="chart-header">Xarajatlar Tarkibi</div>
            <div class="canvas-wrapper">
                <canvas id="doughnutChart"></canvas>
            </div>
        </div>
        <div class="chart-container">
            <div class="chart-header">Sof Foyda Trendi</div>
            <div class="canvas-wrapper">
                <canvas id="lineChart"></canvas>
            </div>
        </div>
        <div class="chart-container">
            <div class="chart-header">Filiallar Kesimida Sotuvlar</div>
            <div class="canvas-wrapper">
                <canvas id="branchChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Bugungi sanani ko'rsatish
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('uz-UZ', { year: 'numeric', month: 'long', day: 'numeric' });

        // Valyuta kursi
        const USD_RATE = 12650;

        // Baza ma'lumotlarini generatsiya qilish (Simulyatsiya)
        const generateData = () => {
            return {
                revenue: Math.floor(Math.random() * 5000000000) + 1000000000,
                expenses: Math.floor(Math.random() * 3000000000) + 500000000,
                customers: Math.floor(Math.random() * 1500) + 500,
                expenseBreakdown: [Math.random()*40, Math.random()*25, Math.random()*20, Math.random()*15],
                monthlyTrend: Array.from({length: 6}, () => Math.floor(Math.random() * 1000000000) + 500000000)
            };
        };

        // Sonlarni chiroyli formatlash funksiyasi
        const formatMoney = (amount, currency) => {
            let val = currency === 'USD' ? amount / USD_RATE : amount;
            
            if (val >= 1000000000) return (val / 1000000000).toFixed(2) + (currency === 'USD' ? ' mlrd $' : ' mlrd so\'m');
            if (val >= 1000000) return (val / 1000000).toFixed(2) + (currency === 'USD' ? ' mln $' : ' mln so\'m');
            return val.toLocaleString() + (currency === 'USD' ? ' $' : ' so\'m');
        };

        // Grafik obyektlarini saqlash uchun
        let charts = {};

        // Grafiklarni yaratish
        const initCharts = () => {
            Chart.defaults.color = '#94A3B8';
            Chart.defaults.font.family = 'Inter';

            // 1. Daromad vs Xarajat (Bar Chart)
            const ctxBar = document.getElementById('barChart').getContext('2d');
            charts.bar = new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: ['Yan', 'Fev', 'Mar', 'Apr', 'May', 'Iyun'],
                    datasets: [
                        { label: 'Daromad', backgroundColor: '#3B82F6', data: [] },
                        { label: 'Xarajat', backgroundColor: '#F59E0B', data: [] }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // 2. Xarajatlar tarkibi (Doughnut Chart)
            const ctxDoughnut = document.getElementById('doughnutChart').getContext('2d');
            charts.doughnut = new Chart(ctxDoughnut, {
                type: 'doughnut',
                data: {
                    labels: ['Oylik Maoshlar', 'Soliqlar', 'Marketing', 'Logistika'],
                    datasets: [{ backgroundColor: ['#3B82F6', '#22C55E', '#F59E0B', '#EF4444'], data: [] }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
            });

            // 3. Sof Foyda Trendi (Line Chart)
            const ctxLine = document.getElementById('lineChart').getContext('2d');
            charts.line = new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: ['Yan', 'Fev', 'Mar', 'Apr', 'May', 'Iyun'],
                    datasets: [{ label: 'Sof Foyda', borderColor: '#22C55E', backgroundColor: 'rgba(34, 197, 94, 0.1)', fill: true, tension: 0.4, data: [] }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // 4. Filiallar kesimi
            const ctxBranch = document.getElementById('branchChart').getContext('2d');
            charts.branch = new Chart(ctxBranch, {
                type: 'bar',
                data: {
                    labels: ['Toshkent', 'Samarqand', 'Farg\'ona'],
                    datasets: [{ label: 'Sotuv hajmi', backgroundColor: '#8B5CF6', data: [] }]
                },
                options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y' }
            });
        };

        // Dashboardni yangilash (Filtrlar o'zgarganda ishlaydi)
        const updateDashboard = () => {
            const currency = document.getElementById('filter-currency').value;
            const data = generateData(); // Haqiqiy loyihada bu yerdan API orqali ma'lumot keladi
            
            let profit = data.revenue - data.expenses;

            // KPI larni yangilash
            document.getElementById('kpi-revenue').innerText = formatMoney(data.revenue, currency);
            document.getElementById('kpi-expenses').innerText = formatMoney(data.expenses, currency);
            document.getElementById('kpi-profit').innerText = formatMoney(profit, currency);
            document.getElementById('kpi-customers').innerText = data.customers.toLocaleString();

            // Grafiklarni yangilash
            let barRev = data.monthlyTrend.map(v => currency === 'USD' ? v/USD_RATE : v);
            let barExp = barRev.map(v => v * (Math.random() * 0.4 + 0.4)); // Xarajatlar daromadning 40-80% qismi
            
            charts.bar.data.datasets[0].data = barRev;
            charts.bar.data.datasets[1].data = barExp;
            charts.bar.update();

            charts.doughnut.data.datasets[0].data = data.expenseBreakdown;
            charts.doughnut.update();

            let lineProfit = barRev.map((v, i) => v - barExp[i]);
            charts.line.data.datasets[0].data = lineProfit;
            charts.line.update();

            charts.branch.data.datasets[0].data = [
                data.revenue * 0.55, // Toshkent 55%
                data.revenue * 0.25, // Samarqand 25%
                data.revenue * 0.20  // Farg'ona 20%
            ].map(v => currency === 'USD' ? v/USD_RATE : v);
            charts.branch.update();
        };

        // Filter o'zgarishlarini eshitish
        document.querySelectorAll('select').forEach(select => {
            select.addEventListener('change', updateDashboard);
        });

        // Dastlabki ishga tushirish
        window.onload = () => {
            initCharts();
            updateDashboard();
        };
    </script>
</body>
</html>
